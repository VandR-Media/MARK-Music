/* Author-approved rendered 3D case artwork as baked material plates.

.device.artdevice{display:flex;align-items:center;justify-content:center;border:none;background:transparent;box-shadow:none;border-radius:0;overflow:visible}
.device.artdevice:before,.device.artdevice:after{display:none}
.device.artdevice>.screws{display:none}
.artdevice .bezel{position:relative;inset:unset;width:min(100%,620px);height:100%;max-height:100%;aspect-ratio:1/1;min-height:0;min-width:0;display:block;padding:0;border:0;background:transparent;box-shadow:none;overflow:visible}
.photo-stage{position:absolute;inset:0;max-height:100%;aspect-ratio:1;margin:auto;isolation:isolate;filter:drop-shadow(0 18px 20px #0009)}
.photo-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}

.meter-overlay{position:absolute;z-index:1;overflow:hidden}

.photo-stage .ledLabel{display:none}
.photo-stage .led{border-radius:1px;box-shadow:inset 0 0 3px #fff1}
.photo-stage .led.active{box-shadow:0 0 8px currentColor,inset 0 0 3px #fff7}
.photo-stage .led.active.cyan{background:#25dbff}.photo-stage .led.active.pink{background:#ff37d5}
.photo-stage .needle-photo{position:absolute;width:2px;height:26%;left:33%;bottom:44%;background:linear-gradient(#ffffff,#5fe9ff 55%,#163355);box-shadow:0 0 6px #73ecff;transform-origin:50% 96%;z-index:4;border-radius:3px;pointer-events:none}
.photo-stage .needle-photo.pink{background:linear-gradient(#ffffff,#ffb5e7 55%,#461c3a);box-shadow:0 0 6px #ff6de9}
.photo-stage .needle-photo:after{content:'';position:absolute;left:-5px;bottom:0;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#effaff,#556476 48%,#030711 90%)}
.photo-stage .toweroverlay{position:absolute;z-index:2;overflow:hidden;border-radius:12% 12% 0 0;background:linear-gradient(100deg,#03233e82,#020813dc 40%,#09091b7a);box-shadow:inset 2px 0 3px #9af9ff65,inset -3px 0 5px #060519}
.photo-stage .toweroverlay .liquid{bottom:0;left:3%;right:3%;transition:height .08s ease-out}
.photo-stage .ringoverlay{position:absolute;z-index:3;aspect-ratio:1;border-radius:50%;filter:drop-shadow(0 0 9px #19edff)}
.photo-stage .ringoverlay.pink{filter:drop-shadow(0 0 9px #ff4bdd)}
.photo-stage .photo-osc{position:absolute;z-index:4;background:#010915d0;border-radius:11%;overflow:hidden;border:1px solid #6db9df66;box-shadow:inset 0 0 17px #000,0 0 9px #00e5ff5e}

.photo-stage .photo-osc canvas{width:100%;height:100%;display:block}
.photo-stage .photo-state{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);z-index:5;font:700 9px monospace;letter-spacing:.1em;color:#91efff;background:#0009;padding:4px 8px;border:1px solid #4d8ca159;border-radius:12px;pointer-events:none}

const clamp=v=>Math.max(0,Math.min(1,v)),lerp=(a,b,t)=>a+(b-a)*t;
function screws(){return ''} // surrounding machine contains real screw details
function ladders(count,small=false){return Array.from({length:count},(_,i)=>`<div class="ledGroup" data-i="${i}"><div class="ledStack">${Array.from({length:small?11:23},(_,j)=>`<i class="led" data-segment="${j}"></i>`).join('')}</div><div class="ledLabel">${bands[i%3]}</div></div>`).join('')}
function gauge(i){return `<div class="half"><div class="dial"><div class="dial-title">MARK  &nbsp; VU</div><svg viewBox="0 0 300 160" preserveAspectRatio="xMidYMid meet"><path d="M 24 148 Q 150 -42 276 148" fill="none" stroke="#6a432c" stroke-width="1.8"/>${Array.from({length:13},(_,j)=>{const a=(-1.17+j*2.34/12),x=150+130*Math.sin(a),y=155-127*Math.cos(a),x2=150+112*Math.sin(a),y2=155-110*Math.cos(a);return `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="${j>9?'#c7413b':'#533524'}" stroke-width="${j%2?2:3}"/>`}).join('')}<text x="24" y="152">-24</text><text x="90" y="38">-12</text><text x="149" y="17">-6</text><text x="218" y="40">0</text><text x="259" y="149">+3</text></svg><div class="needle" data-needle="${i}"></div><div class="dial-footer" style="color:${i?'var(--pink)':'var(--cyan)'}">${i?'RIGHT':'LEFT'}</div></div></div>`}
function innerHTML(){const m=state.mode;el('device').dataset.mode=m===2?'towers':'normal';if(m===0){bezel.innerHTML=`<div class="engrave">MARK  ·  STEREO PRECISION VU</div><div class="panel">${gauge(0)}${gauge(1)}</div><div class="control-bay">${ladders(6,true)}</div>`}else if(m===1){bezel.innerHTML=`<div class="engrave">MARK   /   STEREO SPECTRUM MATRIX</div><div class="matrixheader"><span style="color:var(--cyan)">LEFT CHANNEL</span><span style="color:var(--pink)">RIGHT CHANNEL</span></div><div class="matrix">${ladders(6)}</div>`}else if(m===2){bezel.innerHTML=`<div class="engrave">MARK  ·  CRYSTAL ENERGY METERS</div><div class="towers"><div class="pedestal"></div>${Array.from({length:6},(_,i)=>`<div class="tower" data-i="${i}"><div class="liquid"></div><span class="towerlabel">${bands[i%3]}</span></div>`).join('')}</div>`}else if(m===3){bezel.innerHTML=`<div class="engrave">MARK  /  HI-FI MASTER DECK</div><div class="panel" style="height:45%">${gauge(0)}${gauge(1)}</div><div class="control-bay" style="height:27%">${ladders(6,true)}</div><div class="knobs">${Array.from({length:7},()=>'<i class="knob"></i>').join('')}</div>`}else if(m===4){bezel.innerHTML=`<div class="engrave">MARK  /  PULSE RINGS  ·  STEREO 3-BAND</div><div class="rings">${Array.from({length:2},(_,i)=>`<div class="ringGroup ${i?'pink':''}">${Array.from({length:3},(_,j)=>`<i class="ringProgress" data-i="${3*i+j}"></i>`).join('')}<div class="hub"></div><div class="ringName">${i?'RIGHT':'LEFT'}</div></div>`).join('')}</div>`}else{bezel.innerHTML=`<div class="engrave">MARK  /  STEREO WAVE OSCILLOSCOPE</div><div class="oscContainer"><div class="scope"><canvas id="osc0"></canvas></div><div class="scope pink"><canvas id="osc1"></canvas></div></div><div class="control-bay" style="height:23%">${ladders(6,true)}</div><div class="knobs">${Array.from({length:5},()=>'<i class="knob"></i>').join('')}</div>`;oscCanvases=[el('osc0'),el('osc1')]}}

function referenceRender(i){
  el('device').className='device artdevice';
  const pos=(x,y,w,h)=>`left:${x/512*100}%;top:${y/512*100}%;width:${w/512*100}%;height:${h/512*100}%;`;
  const needle=(ch,x,y,len)=>`<i class="needle-photo ${ch?'pink':''}" data-needle="${ch}" style="left:${x/512*100}%;top:${y/512*100}%;height:${len/512*100}%;bottom:auto;transform:rotate(-45deg)"></i>`;
  const six=(locations,segments=13)=>locations.map((r,k)=>`<div class="meter-overlay" style="${pos(...r)};border-radius:2px;background:#000c"><div class="ledGroup" data-i="${k}"><div class="ledStack">${Array.from({length:segments},(_,j)=>`<i class="led" data-segment="${j}"></i>`).join('')}</div></div></div>`).join('');
  const osc=(ch,x,y,w,h)=>`<div class="photo-osc ${ch?'pink':''}" style="${pos(x,y,w,h)}"><canvas id="osc${ch}"></canvas></div>`;
  let instruments='';
  if(i===0){instruments=six([[99,349,27,45],[166,349,28,45],[237,349,28,45],[324,349,27,45],[392,349,27,45],[452,349,24,45]],9)+needle(0,180,220,65)+needle(1,404,221,65)}
  if(i===1){instruments=six([[74,156,36,191],[143,156,36,191],[209,156,36,191],[304,156,36,191],[371,156,35,191],[439,156,34,191]],19)}
  if(i===2){instruments=[[51,152,52,192],[119,100,48,244],[194,159,49,186],[273,151,58,194],[349,114,52,231],[425,154,51,192]].map((r,k)=>`<div class="toweroverlay" data-i="${k}" style="${pos(...r)}"><div class="liquid"></div></div>`).join('')}
  if(i===3){instruments=six([[115,298,35,42],[165,299,31,42],[217,299,32,42],[304,298,34,42],[355,298,33,42],[407,298,35,42]],9)+needle(0,170,189,65)+needle(1,381,198,65)}
  if(i===4){instruments=[[87,159,171,171],[289,158,172,172]].map((r,ch)=>Array.from({length:3},(_,k)=>{const inset=k*32;const rr=[r[0]+inset,r[1]+inset,r[2]-inset*2,r[3]-inset*2];return `<div class="ringoverlay ${ch?'pink':''}" data-i="${ch*3+k}" style="${pos(...rr)};background:conic-gradient(#0de5ff 0deg,#0c2437 360deg);mask:radial-gradient(transparent 48%,black 51% 62%,transparent 66%);-webkit-mask:radial-gradient(transparent 48%,black 51% 62%,transparent 66%)"></div>`}).join('')).join('')}
  if(i===5){instruments=osc(0,78,83,181,140)+osc(1,303,94,163,137)+six([[106,267,31,52],[165,267,31,52],[222,267,31,52],[320,267,31,52],[375,267,31,52],[427,267,29,52]],9)}
  bezel.innerHTML=`<div class="photo-stage"><img src="${ART_IMAGES[i]}" alt="Утверждённая металлическая панель ${names[i]}">${instruments}<div class="photo-state">MARK  ·  ${names[i]}</div></div>`;
  oscCanvases=i===5?[el('osc0'),el('osc1')]:[];
}

function select(i){state.mode=i;referenceRender(i);document.querySelectorAll('#modes button').forEach((b,j)=>b.classList.toggle('active',i===j))}
el('modes').innerHTML=names.map((n,i)=>`<button data-mode="${i}" aria-label="${n}">${('0'+(i+1)).slice(-2)} ${n}</button>`).join('');el('modes').addEventListener('click',e=>{const b=e.target.closest('button');if(b)select(+b.dataset.mode)});select(0);
const frame=el('frame');let drag=false;frame.addEventListener('pointerdown',e=>{drag=true;frame.setPointerCapture(e.pointerId)});frame.addEventListener('pointerup',()=>drag=false);frame.addEventListener('pointermove',e=>{if(!drag)return;const r=frame.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el('wrap').style.transform=`rotateX(${(-y*13-4).toFixed(1)}deg) rotateY(${(x*26).toFixed(1)}deg)`});el('tilt').addEventListener('input',e=>{el('wrap').style.transform=`rotateX(-5deg) rotateY(${e.target.value}deg)`});
const audio=el('audio');state.audio=audio;let source=null;
async function setupAudio(){if(!state.ctx){const ctx=new (window.AudioContext||window.webkitAudioContext)();state.ctx=ctx;source=ctx.createMediaElementSource(audio);const splitter=ctx.createChannelSplitter(2);source.connect(splitter);for(let i=0;i<2;i++){const a=ctx.createAnalyser();a.fftSize=2048;a.smoothingTimeConstant=.68;state.analyzers.push(a);state.samples.push({fft:new Uint8Array(a.frequencyBinCount),wave:new Float32Array(a.fftSize)});splitter.connect(a,i)}source.connect(ctx.destination)}await state.ctx.resume()}
el('file').addEventListener('change',async e=>{if(!e.target.files||!e.target.files[0])return;audio.pause();audio.src=URL.createObjectURL(e.target.files[0]);el('filename').textContent=e.target.files[0].name.slice(0,30);state.ready=true;state.playing=false;el('state').textContent='PCM FILE';await setupAudio();await audio.play();el('play').textContent='Ⅱ Пауза'});
el('play').addEventListener('click',async ()=>{if(!state.ready){el('state').textContent='DEMO';return}await setupAudio();if(audio.paused){await audio.play();el('play').textContent='Ⅱ Пауза'}else{audio.pause();el('play').textContent='▶ Воспроизвести'}});audio.addEventListener('ended',()=>{el('play').textContent='▶ Воспроизвести'});
function demo(t){return [0,1,2,3,4,5].map((k)=>clamp(.13+.25*Math.abs(Math.sin(t*(1.2+k*.19)+k*.8))+.26*Math.pow(Math.abs(Math.sin(t*(2.6+k*.13))),6)))}
function sample(t){if(state.nativeActive){return performance.now()-state.nativeTime < 500 ? state.nativeBands : [0,0,0,0,0,0];}if(!state.ready||!state.ctx)return demo(t);const out=[];for(let channel=0;channel<2;channel++){const a=state.analyzers[channel],s=state.samples[channel];a.getByteFrequencyData(s.fft);a.getFloatTimeDomainData(s.wave);state.wave[channel]=s.wave;let sum=0;for(let v of s.wave)sum+=v*v;state.rms[channel]=Math.sqrt(sum/s.wave.length);const hzPerBin=state.ctx.sampleRate/a.fftSize;for(const [lo,hi] of [[20,200],[200,2000],[2000,Math.min(16000,state.ctx.sampleRate/2)]]){let energy=0,count=0;for(let k=Math.max(1,Math.floor(lo/hzPerBin));k<Math.min(s.fft.length,Math.ceil(hi/hzPerBin));k++){let v=s.fft[k]/255;energy+=v*v;count++}out.push(count?clamp(Math.sqrt(energy/count)*1.6):0)}}return audio.paused?out.map(()=>0):[out[0],out[1],out[2],out[3],out[4],out[5]]}
function drawWave(id,t){const c=oscCanvases[id];if(!c)return;const w=c.clientWidth,h=c.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);if(c.width!==Math.floor(w*dpr)||c.height!==Math.floor(h*dpr)){c.width=Math.floor(w*dpr);c.height=Math.floor(h*dpr)}const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.strokeStyle=id?'#932c7355':'#246f7855';ctx.lineWidth=1;for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo(i*w/8,0);ctx.lineTo(i*w/8,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*h/8);ctx.lineTo(w,i*h/8);ctx.stroke()}const v=state.wave[id],color=id?'#ff65eb':'#3beaff';ctx.shadowColor=color;ctx.shadowBlur=15;ctx.strokeStyle=color;ctx.lineWidth=1.7;ctx.beginPath();for(let i=0;i<300;i++){const x=i*w/299;const yy=v&&state.ready?(v[Math.floor(i*(v.length-1)/299)]||0):Math.sin(i*.09+t*3+id)*.38+Math.sin(i*.16-t*1.3)*.15;const y=h/2-yy*h*.4;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.shadowBlur=0}
function paint(t){const raw=sample(t),v=raw.map((x,i)=>{let attack=x>state.values[i]?.35:.13;const k=attack?.42:.13;return state.values[i]=lerp(state.values[i]||0,x,k)});const rms=(state.ready||state.nativeActive)?state.rms:[v[0]*.7+v[1]*.3,v[3]*.7+v[4]*.3];document.querySelectorAll('.needle').forEach((n,i)=>{const val=clamp(rms[i]||0);const mapped=Math.pow(val,.45);n.style.transform=`rotate(${-57+mapped*114}deg)`});document.querySelectorAll('.ledGroup').forEach(g=>{const i=+g.dataset.i;const leds=g.querySelectorAll('.led');leds.forEach((d,j)=>{const on=j<Math.round(v[i]*leds.length);d.className='led'+(on?' active'+(state.mode===1?' '+(j>17?'hi':j>12?'mid':''):(i>=3?' pink':' cyan')):'')})});document.querySelectorAll('.tower').forEach(n=>{const i=+n.dataset.i;n.querySelector('.liquid').style.height=(5+v[i]*90)+'%'});document.querySelectorAll('.ringProgress').forEach(n=>{const i=+n.dataset.i;const color=i>=3?'#fa4ce0':'#12dcfa';const deg=Math.round(v[i]*350);n.style.background=`conic-gradient(from 0deg,${color} 0 ${deg}deg,#142033 ${deg}deg 360deg)`});if(state.mode===5){drawWave(0,t);drawWave(1,t)}el('state').textContent=state.nativeActive?(performance.now()-state.nativeTime<500?'PCM LIVE':'SILENCE'):state.ready?(audio.paused?'PAUSED':'PCM LIVE'):'DEMO';requestAnimationFrame(now=>paint(now*.001))}
// Native bridge: MARK Audio may pass measured channel peaks and six FFT bands.
window.markVisualFrame=function(frame){if(!frame||!Array.isArray(frame.bands)||frame.bands.length!==6)return;state.values=frame.bands.map(clamp);state.rms=[clamp(frame.left||0),clamp(frame.right||0)];state.nativeActive=true;state.nativeTime=performance.now();state.nativeBands=frame.bands.map(clamp);state.rms=[clamp(frame.left||0),clamp(frame.right||0)];if(frame.waveformLeft&&frame.waveformRight){state.wave=[Float32Array.from(frame.waveformLeft),Float32Array.from(frame.waveformRight)]}};
requestAnimationFrame(now=>paint(now*.001));
})();
</script></body></html>
