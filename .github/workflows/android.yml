name: MARK Audio Android CI
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform and official signing tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Download straight-on Mayak-203 reference for offline packaging
        run: python3 scripts/fetch-mayak-photo.py
      - name: Verify and stage straight-on Весна-202-1 image
        run: python3 scripts/fetch-vesna-photo.py
      - name: Stage and verify five photographic MARK AUDIO visualizers
        run: python3 scripts/prepare-vintage-art.py
      - name: Verify approved high-resolution artwork
        run: |
          set -euo pipefail
          test ! -e app/src/main/assets/mark_audio_logo.webp.b64
          test ! -e app/src/main/assets/mark_welcome.webp.b64
          test ! -e app/src/main/res/drawable/mark_logo.xml
          test ! -e app/src/main/res/drawable/mark_launcher.xml
          python3 - <<'PY'
          from pathlib import Path
          def dimensions(raw):
              i = 2
              while i + 9 < len(raw):
                  if raw[i] != 0xff:
                      i += 1
                      continue
                  i += 1
                  while raw[i] == 0xff: i += 1
                  marker = raw[i]; i += 1
                  if marker in (0xd8, 0x01) or 0xd0 <= marker <= 0xd7: continue
                  length = int.from_bytes(raw[i:i+2], "big")
                  if marker in (0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf):
                      return int.from_bytes(raw[i+5:i+7], "big"), int.from_bytes(raw[i+3:i+5], "big")
                  i += length
              raise ValueError("JPEG dimensions not found")
          for name in ("mark_logo.jpg", "mark_welcome.jpg"):
              p = Path("app/src/main/res/drawable-nodpi") / name
              raw = p.read_bytes()
              assert len(raw) > 400000, f"{name}: unexpected image size"
              assert raw.startswith(bytes.fromhex("ffd8")) and raw.endswith(bytes.fromhex("ffd9"))
              width, height = dimensions(raw)
              assert width >= 1024 and height >= 1024, (name, width, height)
          PY
      - name: Clean build, tests and lint
        shell: bash
        run: |
          set -o pipefail
          gradle clean :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Align unsigned release APK with Android SDK tool
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          INPUT="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="app/build/outputs/apk/release/app-release-unsigned-aligned.apk"
          test -s "$INPUT"
          "$BT/zipalign" -f -p 4 "$INPUT" "$OUTPUT"
          "$BT/zipalign" -c -v -p 4 "$OUTPUT" | tail -n 5
          "$BT/aapt" dump badging "$OUTPUT" | tee apk-badging.txt
          "$BT/aapt" dump permissions "$OUTPUT" | tee apk-permissions.txt
          sha256sum "$OUTPUT" | tee apk-aligned-sha256.txt
      - name: Audit final APK permissions
        shell: bash
        run: bash scripts/audit-release-apk.sh app/build/outputs/apk/release/app-release-unsigned-aligned.apk
      - name: Audit dependency tree
        shell: bash
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > release-dependencies.txt
      - name: Preserve standard APK signing utility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
          test -s signing-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MARK-Audio-v0.7.11-aligned-APKs
          path: |
            build.log
            apk-badging.txt
            apk-permissions.txt
            apk-aligned-sha256.txt
            release-dependencies.txt
            app/build/reports/tests/testDebugUnitTest/**
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned-aligned.apk
            signing-tools/apksigner.jar
          if-no-files-found: warn
