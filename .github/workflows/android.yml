name: MARK Audio Android CI
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify full-resolution approved artwork (no legacy resources)
        run: |
          test ! -e app/src/main/assets/mark_audio_logo.webp.b64
          test ! -e app/src/main/assets/mark_welcome.webp.b64
          test ! -e app/src/main/res/drawable/mark_logo.xml
          test ! -e app/src/main/res/drawable/mark_launcher.xml
          test -s app/src/main/res/drawable-nodpi/mark_logo.jpg
          test -s app/src/main/res/drawable-nodpi/mark_welcome.jpg
          python3 - <<'PY'
          from pathlib import Path
          for name in ("mark_logo.jpg", "mark_welcome.jpg"):
              raw = (Path("app/src/main/res/drawable-nodpi") / name).read_bytes()
              assert len(raw) > 400000, f"{name}: unexpectedly low resolution or truncated"
              assert raw.startswith(bytes.fromhex("ffd8")) and raw.endswith(bytes.fromhex("ffd9")), f"{name}: not a complete JPEG"
          PY
      - name: Unit tests and release build
        shell: bash
        run: |
          set -o pipefail
          gradle clean :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Preserve APK signing utility
        if: success()
        shell: bash
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/zipalign
          chmod +x signing-tools/zipalign
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MARK-Audio-v0.6.1-clean-APKs
          path: |
            build.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools/apksigner.jar
            signing-tools/zipalign
          if-no-files-found: warn
