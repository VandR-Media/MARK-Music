name: MARK Audio Android APK
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests and signed debug APK
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MARK-Audio-v0.2.0
          path: |
            build.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn