name: MARK Cosmic - Free TripoSR GLB Test
on:
  push:
    branches: [experiment/trellis2-free-mark-cosmic-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  triposr-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gradio client
        run: python -m pip install --quiet 'gradio_client>=1.8,<3' pillow
      - name: Single free TripoSR generation attempt
        run: python scripts/experiments/triposr_try.py
        timeout-minutes: 8
      - name: Save result or real API failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARK-Cosmic-TripoSR-Free-Test
          path: tripo-result/
          retention-days: 3
          if-no-files-found: warn
