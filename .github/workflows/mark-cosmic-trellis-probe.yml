name: MARK Cosmic - Free HunyuanMini 40s GLB Test
on:
  push:
    branches: [experiment/trellis2-free-mark-cosmic-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frogleo-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public Gradio API client
        run: python -m pip install --quiet 'gradio_client>=1.8,<3' pillow requests
      - name: Single free 40-second Hunyuan mini Turbo generation
        timeout-minutes: 8
        run: python scripts/experiments/frogleo_free_try.py
      - name: Upload raw generated GLB or precise error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARK-Cosmic-HunyuanMini-40s-Test
          path: frogleo-result/
          retention-days: 3
          if-no-files-found: warn
