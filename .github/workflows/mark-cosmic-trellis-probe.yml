name: MARK Cosmic - Free Hunyuan3D Mini GLB Test
on:
  push:
    branches: [experiment/trellis2-free-mark-cosmic-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hunyuan-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public Gradio API client
        run: python -m pip install --quiet 'gradio_client>=1.8,<3' pillow
      - name: Single free Tencent Hunyuan3D mini Turbo GLB attempt
        run: python scripts/experiments/hunyuan_mini_free_test.py
        timeout-minutes: 8
      - name: Upload result or exact failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARK-Cosmic-HunyuanMini-Free-Test
          path: hunyuan-result/
          retention-days: 3
          if-no-files-found: warn
