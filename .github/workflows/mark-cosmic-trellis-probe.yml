name: MARK Cosmic - FREE Stable Fast 3D Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trellis-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gradio client
        run: python -m pip install --quiet 'gradio_client>=1.8,<3' pillow
      - name: Test anonymous Space API (no GPU generation)
        run: python scripts/experiments/trellis2_probe.py
      - name: Try FREE Stable Fast 3D on approved Mark
        timeout-minutes: 12
        run: python scripts/experiments/stable_fast_3d_try.py
      - name: Publish diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARK-Cosmic-StableFast3D-free-result
          path: trellis-test-result/
          if-no-files-found: ignore
