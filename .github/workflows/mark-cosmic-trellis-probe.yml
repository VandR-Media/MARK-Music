name: MARK Cosmic - FREE Hugging Face GLB Test
on:
  workflow_dispatch:
  push:
    branches: [experiment/trellis2-free-mark-cosmic-20261116]
permissions:
  contents: read
jobs:
  mark-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check free Hugging Face token availability
        shell: bash
        run: |
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "A free account with a read-only Hugging Face HF_TOKEN secret is required."
            echo "No paid service or charge will be used."
          else
            echo "Authenticated free ZeroGPU mode configured. Token is never printed."
          fi
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: '3.11'
      - name: Install open Gradio client
        if: env.HF_TOKEN != ''
        run: python -m pip install --quiet 'gradio_client>=1.8,<3' pillow requests
      - name: Single authorized free 40s 3D generation
        if: env.HF_TOKEN != ''
        timeout-minutes: 8
        run: python scripts/experiments/frogleo_free_try.py
      - name: Publish actual result or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARK-Cosmic-Free-Authenticated-GLB
          path: frogleo-result/
          retention-days: 3
          if-no-files-found: ignore
