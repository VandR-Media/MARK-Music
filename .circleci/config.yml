# CircleCI native pipeline for MARK-Music.
# Build APK on CircleCI compute without relying on the GitHub Actions preview adapter.
# No release signing credentials are accessed; output is a debug APK for on-device testing.
# For manual-only builds, remove the automatic push trigger in CircleCI > Project Settings > Project Setup.
version: 2.1

jobs:
  build_debug_apk:
    docker:
      - image: cimg/android:2026.11
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Check toolchain and install pinned Gradle
          command: |
            set -euo pipefail
            java -version
            sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
            curl -fsSL --retry 3 -o /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
            unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
            /tmp/gradle-8.13/bin/gradle --version

      - run:
          name: Build installable debug APK
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            /tmp/gradle-8.13/bin/gradle --no-daemon :app:assembleDebug --stacktrace
            test -s app/build/outputs/apk/debug/app-debug.apk
            sha256sum app/build/outputs/apk/debug/app-debug.apk

      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: MARK-Music-APK

workflows:
  manual_apk_build:
    jobs:
      - build_debug_apk
